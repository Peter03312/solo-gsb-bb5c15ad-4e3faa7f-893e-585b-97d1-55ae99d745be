services:
  collation:
    build:
      context: .
      dockerfile: Dockerfile
    image: technical-collation:latest
    container_name: technical-collation
    ports:
      # 宿主机端口由 APP_PORT 控制，默认 4000；容器内固定监听 4000
      - "${APP_PORT:-4000}:4000"
    environment:
      DB_PATH: /data/collation.db
      # 首次启动创建的初始管理员（已存在数据卷时不会重复创建）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - collation-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  collation-data:
